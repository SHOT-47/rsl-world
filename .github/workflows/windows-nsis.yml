name: Windows NSIS installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RSL validator requirements
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input -r resources/reverse-skill-library/validation/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Python validation dependency install failed: $LASTEXITCODE" }

      - name: Install locked Node dependencies
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw "npm dependency install failed: $LASTEXITCODE" }

      - name: Run full validation and build Windows x64 NSIS installer
        shell: pwsh
        run: |
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw "Windows package build failed: $LASTEXITCODE" }
          $installer = Get-ChildItem -LiteralPath 'release' -Filter '*Setup.exe' -File | Select-Object -First 1
          if (!$installer) { throw 'No NSIS Setup.exe was generated in release/.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Value ("${hash}  $($installer.Name)") -Encoding utf8
          $manifest = [ordered]@{
            product = 'RSL Workbench'
            version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
            target = 'win-x64-nsis'
            builtAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
            sourceCommit = (git rev-parse HEAD).Trim()
            workflowRunId = '${{ github.run_id }}'
            node = (node --version)
            npm = (npm --version)
            python = (python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
            installer = $installer.Name
            installerBytes = $installer.Length
            sha256 = $hash
            signingConfigured = [bool]($env:CSC_LINK -or $env:WIN_CSC_LINK -or $env:CSC_NAME)
            lockfilePresent = (Test-Path 'package-lock.json')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release/build-manifest.json' -Encoding utf8
          Copy-Item -LiteralPath 'package-lock.json' -Destination 'release/package-lock.json' -Force

      - name: Upload installer and build attestation
        uses: actions/upload-artifact@v4
        with:
          name: RSL-Workbench-v0.2.0-Windows-x64-NSIS
          path: |
            release/*Setup.exe
            release/SHA256SUMS.txt
            release/build-manifest.json
            release/package-lock.json
          if-no-files-found: error
          retention-days: 14
