name: Browser build

on:
  push:
    branches: [main, web-browser-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check browser architecture
        run: npm run test:static
      - name: Typecheck
        run: npm run typecheck
      - name: Build browser assets
        run: npm run build
