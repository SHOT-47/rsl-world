name: Bootstrap RSL Workbench and build Windows NSIS installer

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/bootstrap-rsl-workbench.yml'

permissions:
  contents: write

concurrency:
  group: rsl-workbench-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-and-build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the reviewed source archive
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '206c7ead741f803d2f05bf95407ef008fd83327aec34035304e261ecbc376c01'
          $matches = @(
            Get-ChildItem -LiteralPath $PWD.Path -File -Filter '*.zip' |
              Where-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expected }
          )
          if ($matches.Count -ne 1) {
            throw "Expected exactly one approved source ZIP with SHA-256 $expected at repository root; found $($matches.Count)."
          }
          $archive = $matches[0]
          "archive=$($archive.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Approved archive: $($archive.Name)"
          Write-Host "SHA-256: $expected"

      - name: Set up Python for safe archive validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate archive paths and structure before extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = '${{ steps.source.outputs.archive }}'
          @'
          import pathlib, re, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as z:
              bad = []
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  parts = name.split('/')
                  if name.startswith('/') or re.match(r'^[A-Za-z]:', name) or any(p == '..' for p in parts):
                      bad.append(info.filename)
              if bad:
                  raise SystemExit('Unsafe archive paths detected: ' + repr(bad[:10]))
              names = set(z.namelist())
              required = {'package.json', 'scripts/build-windows.ps1', '.github/workflows/windows-nsis.yml'}
              missing = required - names
              if missing:
                  raise SystemExit('Required source files missing: ' + repr(sorted(missing)))
          print('Archive structure and extraction paths verified.')
          '@ | python - $archive
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }

      - name: Expand source and update repository working tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = '${{ steps.source.outputs.archive }}'
          $source = Join-Path $PWD.Path '.rsl-workbench-source'
          if (Test-Path $source) { Remove-Item -LiteralPath $source -Recurse -Force }
          New-Item -ItemType Directory -Path $source | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $source -Force
          if (!(Test-Path (Join-Path $source 'package.json'))) { throw 'package.json missing after extraction.' }
          & robocopy $source $PWD.Path /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /XD node_modules release .git
          $copyCode = $LASTEXITCODE
          # Robocopy codes 0-7 are success/warning outcomes; clear the native exit code so pwsh does not mark this step failed at script end.
          if ($copyCode -gt 7) { throw "Source copy failed with robocopy code $copyCode." }
          $global:LASTEXITCODE = 0
          Remove-Item -LiteralPath $source -Recurse -Force
          Write-Host 'Source files expanded into the repository root.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies and generate lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit code $LASTEXITCODE." }
          if (!(Test-Path 'package-lock.json')) { throw 'npm did not generate package-lock.json.' }

      - name: Commit extracted source and lockfile to the repository
        id: commit_sources
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repoUpdated = $false
          try {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if ($LASTEXITCODE -ne 0) { throw 'git add failed.' }
            git diff --cached --quiet
            $diffCode = $LASTEXITCODE
            if ($diffCode -eq 1) {
              git commit -m 'Bootstrap RSL Workbench v0.2.0 source and lockfile'
              if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
              git push origin HEAD:${{ github.ref_name }}
              if ($LASTEXITCODE -ne 0) { throw 'Push failed. Check Actions contents:write permissions and branch protection.' }
            } elseif ($diffCode -ne 0) {
              throw "git diff failed with exit code $diffCode."
            } else {
              Write-Host 'No repository changes to commit.'
            }
            $repoUpdated = $true
          } catch {
            Write-Warning "Could not persist expanded source/lockfile to the repository: $($_.Exception.Message). The Windows build will still run from the checked-out workspace."
          }
          "repo_updated=$($repoUpdated.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run validation and build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw "package:win failed with exit code $LASTEXITCODE." }
          $installer = Get-ChildItem -LiteralPath 'release' -Filter '*Setup.exe' -File | Select-Object -First 1
          if (!$installer) { throw 'No Setup.exe was produced in release/.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Value ("${hash}  $($installer.Name)") -Encoding utf8
          $manifest = [ordered]@{
            product = 'RSL Workbench'
            version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
            target = 'win-x64-nsis'
            builtAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
            sourceArchive = '${{ steps.source.outputs.archive }}'
            sourceArchiveSha256 = '206c7ead741f803d2f05bf95407ef008fd83327aec34035304e261ecbc376c01'
            sourceCommit = (git rev-parse HEAD).Trim()
            sourcePersistedToRepository = '${{ steps.commit_sources.outputs.repo_updated }}'
            workflowRunId = '${{ github.run_id }}'
            node = (node --version)
            npm = (npm --version)
            python = (python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
            installer = $installer.Name
            installerBytes = $installer.Length
            sha256 = $hash
            signingConfigured = [bool]($env:CSC_LINK -or $env:WIN_CSC_LINK -or $env:CSC_NAME)
            lockfilePresent = (Test-Path 'package-lock.json')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release/build-manifest.json' -Encoding utf8
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA-256: $hash"

      - name: Upload installer, checksum, and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: RSL-Workbench-v0.2.0-Windows-x64-NSIS
          path: |
            release/*Setup.exe
            release/SHA256SUMS.txt
            release/build-manifest.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14
