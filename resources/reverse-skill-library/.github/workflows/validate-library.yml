name: Validate RSL library

on:
  push:
  pull_request:

jobs:
  contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r validation/requirements-test.txt
      - name: Static and schema validation
        run: python validation/check_library.py
      - name: Contract/regression suite
        run: python -m unittest discover -s validation -p "test_*.py" -v
